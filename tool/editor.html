<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Drawer Visual Editor</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f3f4f6; color: #111827; }
        .app { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; min-height: 100vh; height: 100vh; overflow: hidden; }
        .panel { background: #fff; border-right: 1px solid #e5e7eb; padding: 16px; overflow: auto; height: 100vh; }
        .panel.right { border-right: 0; border-left: 1px solid #e5e7eb; }
        h1, h2, h3 { margin: 0 0 12px; }
        .field-list, .actions, .component-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .row { display: flex; gap: 8px; }
        .stack-gap { margin-top: 10px; }
        button, select, input, textarea { width: 100%; font-size: 13px; border-radius: 8px; border: 1px solid #d1d5db; padding: 10px 12px; background: #fff; }
        button { cursor: pointer; }
        button.primary { background: #1677ff; border-color: #1677ff; color: #fff; }
        .canvas-wrap { padding: 16px; overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .canvas-shell { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .canvas-frame { transform-origin: center center; display: flex; align-items: center; justify-content: center; flex: 1; }
        .zoom-bar { display: flex; gap: 8px; margin-bottom: 12px; }
        .canvas { position: relative; width: 960px; height: 720px; background: #fff; border: 1px solid #d1d5db; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); background-image: linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px); background-size: 16px 16px; }
        .guide-x, .guide-y { position: absolute; background: rgba(22, 119, 255, 0.4); pointer-events: none; z-index: 100; }
        .guide-x { width: 1px; top: 0; bottom: 0; }
        .guide-y { height: 1px; left: 0; right: 0; }
        .node { position: absolute; border: 1px dashed #6b7280; padding: 8px; cursor: move; overflow: hidden; user-select: none; border-radius: 10px; }
        .node.active { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15); }
        .node-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
        .node-level { font-size: 11px; color: #6b7280; font-weight: 500; }
        .node-text { font-size: 12px; color: #374151; white-space: pre-wrap; line-height: 1.4; }
        .table-grid { margin-top: 6px; display: grid; gap: 0; border: 1px solid rgba(107,114,128,0.25); background: rgba(255,255,255,0.9); }
        .table-cell { min-height: 26px; padding: 4px 6px; border-right: 1px solid rgba(107,114,128,0.18); border-bottom: 1px solid rgba(107,114,128,0.18); font-size: 11px; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(255,255,255,0.92); }
        .table-cell.header { font-weight: 700; background: rgba(243,244,246,0.96); }
        .table-cell.active { outline: 2px solid #1677ff; outline-offset: -2px; background: rgba(219,234,254,0.96); }
        .resize-handle { position: absolute; width: 10px; height: 10px; right: -5px; bottom: -5px; background: #1677ff; border-radius: 50%; cursor: se-resize; }
        .inline-editor { position: absolute; z-index: 20; border: 1px solid #1677ff; border-radius: 8px; padding: 8px; resize: none; font-size: 12px; line-height: 1.4; outline: none; background: rgba(255,255,255,0.98); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .tree { font-size: 12px; color: #374151; margin-top: 8px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; white-space: pre-wrap; }
        label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-bottom: 10px; }
        textarea { min-height: 120px; }
        .hint { font-size: 12px; color: #6b7280; margin-bottom: 12px; line-height: 1.5; }
        .component-button { text-align: left; }
        .component-button small { display: block; color: #6b7280; margin-top: 4px; }
        .section-block { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
        .component-group { border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .component-group summary { list-style: none; cursor: pointer; padding: 10px 12px; font-size: 13px; font-weight: 600; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
        .component-group summary::-webkit-details-marker { display: none; }
        .component-group[open] summary { background: #f3f4f6; }
        .component-group-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .table-editor-grid { display: flex; flex-direction: column; gap: 8px; }
        .table-editor-row { display: grid; gap: 6px; }
        .table-editor-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="app">
        <aside class="panel">
            <h1>组件区</h1>
            <div class="hint">左右栏固定，中间展示区占满剩余空间并居中显示。节点不会超出中间网格。</div>
            <div class="section-block">
                <h3>常用组件</h3>
                <div id="component-list" class="component-list"></div>
                <div class="row stack-gap"><select id="template-select">
                        <option value="list">列表页模板（侧栏 + 筛选 + 表格）</option>
                        <option value="dashboard">Dashboard 模板（指标卡 + 表格）</option>
                        <option value="form">表单页模板（表单容器）</option>
                        <option value="detail">详情页模板（信息卡 + 日志）</option>
                    </select></div>
                <div class="row stack-gap"><select id="template-import-mode">
                        <option value="replace">清空导入</option>
                        <option value="append">追加导入</option>
                    </select></div>
                <div class="row stack-gap"><button id="import-template">一键导入</button></div>
                <div class="row stack-gap"><button id="duplicate-node">复制</button><button id="undo">撤销</button><button id="redo">重做</button></div>
            </div>
            <div class="section-block">
                <h2>页面信息</h2>
                <div class="field-list">
                    <label>页面类型<select id="pageType"><option value="list">列表页</option><option value="dashboard">Dashboard</option><option value="form">表单页</option><option value="detail">详情页</option></select></label>
                    <label>页面名称<input id="pageName" value="未命名页面" /></label>
                    <label>备注<textarea id="notes" placeholder="补充这个页面的说明"></textarea></label>
                </div>
            </div>
        </aside>
        <main class="canvas-wrap">
            <div class="canvas-shell">
                <div class="zoom-bar"><button id="zoom-out">-</button><button id="zoom-reset">100%</button><button id="zoom-in">+</button></div>
                <div class="hint">支持中文输入法；组合输入完成前不会提前渲染拼音。</div>
                <div id="canvas-frame" class="canvas-frame"><div id="canvas" class="canvas"></div></div>
            </div>
        </main>
        <aside class="panel right">
            <h1>节点编辑 / 导入导出</h1>
            <div class="hint">快捷键：Delete 删除；Ctrl/Cmd+D 复制；Ctrl/Cmd+Z 撤销；Ctrl/Cmd+Shift+Z 重做。</div>
            <div id="node-editor">
                <label>父节点 ID<input id="nodeParentId" /></label>
                <label>节点类型<input id="nodeType" /></label>
                <label>节点标题<input id="nodeTitle" /></label>
                <label>节点名称<input id="nodeName" /></label>
                <label>节点文字<textarea id="nodeText"></textarea></label>
                <label>X<input id="nodeX" type="number" /></label>
                <label>Y<input id="nodeY" type="number" /></label>
                <label>Z轴<input id="nodeZIndex" type="number" value="0" /></label>
                <label>宽<input id="nodeWidth" type="number" /></label>
                <label>高<input id="nodeHeight" type="number" /></label>
                                <button id="update-node">更新节点</button>
                <div id="table-actions" class="row" style="display:none; margin-bottom:10px; flex-wrap:wrap;">
                    <button id="add-row" type="button">增行</button>
                    <button id="remove-row" type="button">删行</button>
                    <button id="add-col" type="button">增列</button>
                    <button id="remove-col" type="button">删列</button>
                </div>
                <div id="table-editor" style="display:none; margin-bottom:12px; border:1px solid #e5e7eb; border-radius:10px; padding:10px; background:#fafafa;"></div>
                <button id="delete-node">删除节点</button>
            </div>
            <div class="actions">
                <button class="primary" id="export-json">导出 unified JSON</button>
                <button id="copy-json">复制 JSON</button>
                <button id="import-json">从 JSON 回显</button>
            </div>
            <div class="tree" id="tree-view"></div>
            <textarea id="output"></textarea>
        </aside>
    </div>
    <script type="module">
        import * as Core from './editor-core.js';
        window.addEventListener('error', (event) => { console.error('[figma-drawer-error]', event.message, event.error); });
        window.addEventListener('unhandledrejection', (event) => { console.error('[figma-drawer-rejection]', event.reason); });
        const { DEFAULT_CANVAS, GRID_SIZE, appendTableColumn, appendTableRow, buildTemplateNodes, COMPONENT_LIBRARY, constrainNode, createNode, duplicateNode, findAlignmentGuides, NODE_TYPE_META, normalizeFormInput, normalizeTableConfig, parseUnifiedJson, removeTableColumn, removeTableRow, serializeState, updateNodePosition, updateNodeSize, updateNodeText, updateNodeTitle, updateTableCell, updateTableColumns, softSnap } = Core;
        const canvas = document.getElementById('canvas');
        const canvasFrame = document.getElementById('canvas-frame');
        const output = document.getElementById('output');
        const treeView = document.getElementById('tree-view');
        const componentList = document.getElementById('component-list');
        const nodeEditor = document.getElementById('node-editor');
        const tableActions = document.getElementById('table-actions');
        const tableEditor = document.getElementById('table-editor');
        const formIds = ['pageType', 'pageName', 'notes'];
        const nodeEditorIds = ['nodeParentId','nodeType','nodeTitle','nodeName','nodeText','nodeX','nodeY','nodeWidth','nodeHeight','nodeZIndex'];
        const COMPONENT_GROUPS = [
            { key: 'layout', title: '布局类', items: ['sidebar', 'tabs', 'breadcrumb'] },
            { key: 'form', title: '表单类', items: ['input', 'select', 'datePicker', 'search', 'button'] },
            { key: 'display', title: '展示类', items: ['table', 'card', 'tag', 'text', 'title', 'image'] },
            { key: 'feedback', title: '反馈类', items: ['modal', 'pagination'] },
        ];
        let nodes = [];
        let activeId = null;
        let dragState = null;
        let inlineEditor = null;
        let activeTableCell = null;
        let activeTableEditorField = null;
        let zoom = 1;
        let guides = { x: null, y: null };
        let isSyncingEditor = false;
        let isComposing = false;
        let activeEditorField = null;
        const history = [];
        const future = [];

        const fitCanvasZoom = () => {
            const container = canvasFrame.getBoundingClientRect();
            if (!container.width || !container.height) return 1;
            const widthRatio = (container.width - 24) / DEFAULT_CANVAS.width;
            const heightRatio = (container.height - 24) / DEFAULT_CANVAS.height;
            return Math.max(0.5, Math.min(1, Number(Math.min(widthRatio, heightRatio).toFixed(2))));
        };
        const snapshot = () => ({ nodes: JSON.parse(JSON.stringify(nodes)), form: getFormRaw(), activeId, zoom });
        const pushHistory = () => { history.push(snapshot()); if (history.length > 50) history.shift(); future.length = 0; syncHistoryButtons(); };
        const restore = (state) => {
            nodes = state.nodes || [];
            activeId = state.activeId || null;
            zoom = state.zoom || fitCanvasZoom();
            Object.entries(state.form || {}).forEach(([key, value]) => { const el = document.getElementById(key); if (el) el.value = value; });
            applyZoom(); render(); exportJson(); syncHistoryButtons();
        };
        const applyZoom = () => { canvasFrame.style.transform = `scale(${zoom})`; document.getElementById('zoom-reset').textContent = `${Math.round(zoom * 100)}%`; };
        const syncHistoryButtons = () => {
            document.getElementById('undo').disabled = history.length === 0;
            document.getElementById('redo').disabled = future.length === 0;
        };
        const getDepth = (node) => { let depth = 0; let parentId = node.parentId; while (parentId && parentId !== 'root') { const parent = nodes.find((item) => item.id === parentId); if (!parent) break; depth += 1; parentId = parent.parentId; } return depth; };
        const renderTree = () => { const lines = ['层级结构']; const walk = (parentId, depth) => { nodes.filter((item) => (item.parentId || 'root') === parentId).forEach((node) => { lines.push(`${'  '.repeat(depth)}- ${node.title || node.name} [${node.id}]`); walk(node.id, depth + 1); }); }; walk('root', 0); treeView.textContent = lines.join('\n'); };
        const renderGuides = () => {
            canvas.querySelectorAll('.guide-x,.guide-y').forEach((el) => el.remove());
            if (guides.x !== null) { const line = document.createElement('div'); line.className = 'guide-x'; line.style.left = `${guides.x}px`; canvas.appendChild(line); }
            if (guides.y !== null) { const line = document.createElement('div'); line.className = 'guide-y'; line.style.top = `${guides.y}px`; canvas.appendChild(line); }
        };
        const render = () => {
            closeInlineEditor();
            canvas.innerHTML = '';
            const ordered = [...nodes]
                .map((node, index) => ({ node, index }))
                .sort((a, b) => Number(a.node.zIndex || 0) - Number(b.node.zIndex || 0) || a.index - b.index)
                .map((item) => item.node);
            ordered.forEach((rawNode) => {
                const node = constrainNode(rawNode, DEFAULT_CANVAS);
                const meta = NODE_TYPE_META[node.type] || { color: '#E5E7EB' };
                const depth = getDepth(node);
                const el = document.createElement('div');
                el.className = `node${node.id === activeId ? ' active' : ''}`;
                el.style.left = `${node.x}px`;
                el.style.top = `${node.y}px`;
                el.style.width = `${node.width}px`;
                el.style.height = `${node.height}px`;
                el.style.background = meta.color;
                el.style.zIndex = String(10 + Number(node.zIndex || 0) + depth * 1000 + ordered.findIndex((item) => item.id === node.id));
                el.dataset.id = node.id;
                const titleEl = document.createElement('div');
                titleEl.className = 'node-title';
                titleEl.innerHTML = `<span>${node.title || node.name}</span><span class="node-level">L${depth} · Z${Number(node.zIndex || 0)}</span>`;
                titleEl.addEventListener('dblclick', (event) => openInlineEditor(event, node.id, 'title'));
                const textEl = document.createElement('div');
                textEl.className = 'node-text';
                textEl.textContent = node.text || node.type;
                textEl.addEventListener('dblclick', (event) => openInlineEditor(event, node.id, 'text'));
                el.appendChild(titleEl);
                el.appendChild(textEl);
                if (node.type === 'table') {
                    const table = normalizeTableConfig(node.tableConfig);
                    const grid = document.createElement('div');
                    grid.className = 'table-grid';
                    grid.style.gridTemplateColumns = `repeat(${table.columns.length}, minmax(0, 1fr))`;
                    table.columns.forEach((column, colIndex) => {
                        const cell = document.createElement('div');
                        cell.className = `table-cell header${activeTableCell && activeTableCell.nodeId === node.id && activeTableCell.rowIndex === -1 && activeTableCell.colIndex === colIndex ? ' active' : ''}`;
                        cell.textContent = column;
                        cell.addEventListener('click', (event) => { event.stopPropagation(); activeTableCell = { nodeId: node.id, rowIndex: -1, colIndex }; selectNode(node.id); });
                        grid.appendChild(cell);
                    });
                    table.rows.forEach((row, rowIndex) => {
                        row.forEach((value, colIndex) => {
                            const cell = document.createElement('div');
                            cell.className = `table-cell${activeTableCell && activeTableCell.nodeId === node.id && activeTableCell.rowIndex === rowIndex && activeTableCell.colIndex === colIndex ? ' active' : ''}`;
                            cell.textContent = value || ' ';
                            cell.addEventListener('click', (event) => { event.stopPropagation(); activeTableCell = { nodeId: node.id, rowIndex, colIndex }; selectNode(node.id); });
                            grid.appendChild(cell);
                        });
                    });
                    el.appendChild(grid);
                }
                el.addEventListener('mousedown', (event) => startDrag(event, node.id, 'move'));
                el.addEventListener('click', () => selectNode(node.id));
                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'resize-handle';
                resizeHandle.addEventListener('mousedown', (event) => startDrag(event, node.id, 'resize'));
                el.appendChild(resizeHandle);
                canvas.appendChild(el);
            });
            renderGuides(); syncNodeEditor(); renderTree();
        };
        const getFormRaw = () => Object.fromEntries(formIds.map((id) => [id, document.getElementById(id).value]));
        const getFormData = () => normalizeFormInput(getFormRaw());
        const exportJson = () => { output.value = serializeState({ form: getFormData(), nodes, canvas: DEFAULT_CANVAS }); };
        const computeInsertPosition = (meta) => {
            const centerX = Math.max(24, Math.round((DEFAULT_CANVAS.width - (meta.defaultWidth || 160)) / 2 / GRID_SIZE) * GRID_SIZE);
            const centerY = Math.max(24, Math.round((DEFAULT_CANVAS.height - (meta.defaultHeight || 60)) / 2 / GRID_SIZE) * GRID_SIZE);
            const offset = Math.min(nodes.length, 6) * 16;
            return { x: centerX + offset, y: centerY + offset };
        };
        const moveActiveNodeByKeyboard = (deltaX, deltaY) => {
            const index = nodes.findIndex((item) => item.id === activeId);
            if (index < 0) return;
            pushHistory();
            nodes[index] = updateNodePosition(nodes[index], deltaX, deltaY, null, DEFAULT_CANVAS);
            nodes = [...nodes];
            render();
            exportJson();
        };
        const applyNodeEditorChanges = ({ push = false, targetId = activeId } = {}) => {
            if (isSyncingEditor || isComposing || !targetId) return;
            const index = nodes.findIndex((item) => item.id === targetId);
            if (index < 0) return;
            const current = nodes[index];
            const next = constrainNode({
                ...current,
                parentId: document.getElementById('nodeParentId').value || 'root',
                type: document.getElementById('nodeType').value,
                title: document.getElementById('nodeTitle').value,
                name: document.getElementById('nodeName').value,
                text: document.getElementById('nodeText').value,
                x: softSnap(document.getElementById('nodeX').value),
                y: softSnap(document.getElementById('nodeY').value),
                zIndex: Number((document.getElementById('nodeZIndex').value ?? '').trim() || 0),
                width: Math.max(24, softSnap(document.getElementById('nodeWidth').value)),
                height: Math.max(24, softSnap(document.getElementById('nodeHeight').value)),
                ...(current.type === 'table' ? { tableConfig: normalizeTableConfig(current.tableConfig) } : {}),
            }, DEFAULT_CANVAS);
            const changed = JSON.stringify(current) !== JSON.stringify(next);
            if (!changed) return;
            if (push) pushHistory();
            nodes = nodes.map((item, itemIndex) => (itemIndex === index ? next : item));
            if (activeId === targetId) activeId = next.id;
            render();
            exportJson();
        };
        const addNode = (type) => {
            pushHistory();
            const meta = NODE_TYPE_META[type] || { label: '组件', defaultWidth: 160, defaultHeight: 60, defaultText: '组件内容' };
            const pos = computeInsertPosition(meta);
            const node = constrainNode(createNode({ id: `node_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`, type, parentId: 'root', name: meta.label, title: meta.label, text: meta.defaultText, x: pos.x, y: pos.y, width: meta.defaultWidth, height: meta.defaultHeight }), DEFAULT_CANVAS);
            nodes = [...nodes, node];
            activeId = node.id;
            render();
            exportJson();
            return node;
        };
        const insertPreset = (key, mode = 'append') => {
            pushHistory();
            const presetNodes = buildTemplateNodes(key).map((node) => constrainNode(node, DEFAULT_CANVAS));
            nodes = mode === 'replace' ? presetNodes : [...nodes, ...presetNodes];
            activeId = presetNodes[0]?.id || activeId;
            render();
            exportJson();
        };
        const selectNode = (id) => { applyNodeEditorChanges({ push: true }); activeId = id; render(); };
        const renderTableEditor = (node) => {
            if (!node || node.type !== 'table') {
                tableEditor.style.display = 'none';
                tableEditor.innerHTML = '';
                activeTableEditorField = null;
                return;
            }
            if (activeTableEditorField && tableEditor.contains(document.activeElement)) {
                tableEditor.style.display = 'block';
                return;
            }
            const table = normalizeTableConfig(node.tableConfig);
            tableEditor.style.display = 'block';
            tableEditor.innerHTML = '';

            const headerLabel = document.createElement('div');
            headerLabel.className = 'table-editor-label';
            headerLabel.textContent = '表头';
            tableEditor.appendChild(headerLabel);

            const headerRow = document.createElement('div');
            headerRow.className = 'table-editor-row';
            headerRow.style.gridTemplateColumns = `repeat(${table.columns.length}, minmax(0, 1fr))`;
            table.columns.forEach((column, colIndex) => {
                const input = document.createElement('input');
                input.value = column;
                input.addEventListener('focus', () => { activeTableEditorField = `header-${colIndex}`; });
                input.addEventListener('blur', () => { activeTableEditorField = null; render(); });
                input.addEventListener('input', () => {
                    const index = nodes.findIndex((item) => item.id === node.id);
                    if (index < 0) return;
                    const current = nodes[index];
                    const currentTable = normalizeTableConfig(current.tableConfig);
                    const columns = currentTable.columns.map((item, idx) => idx === colIndex ? input.value : item);
                    nodes[index] = { ...current, text: columns.map((item, idx) => item.trim() || `列${idx + 1}`).join(' ｜ '), tableConfig: { columns, rows: currentTable.rows } };
                    nodes = [...nodes];
                    exportJson();
                });
                headerRow.appendChild(input);
            });
            tableEditor.appendChild(headerRow);

            const bodyLabel = document.createElement('div');
            bodyLabel.className = 'table-editor-label';
            bodyLabel.style.marginTop = '8px';
            bodyLabel.textContent = '表格内容';
            tableEditor.appendChild(bodyLabel);

            const body = document.createElement('div');
            body.className = 'table-editor-grid';
            table.rows.forEach((row, rowIndex) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'table-editor-row';
                rowEl.style.gridTemplateColumns = `repeat(${table.columns.length}, minmax(0, 1fr))`;
                row.forEach((value, colIndex) => {
                    const input = document.createElement('input');
                    input.value = value;
                    input.placeholder = `${table.columns[colIndex] || `列${colIndex + 1}`}`;
                    input.addEventListener('focus', () => { activeTableEditorField = `cell-${rowIndex}-${colIndex}`; });
                    input.addEventListener('blur', () => { activeTableEditorField = null; render(); });
                    input.addEventListener('input', () => {
                        const index = nodes.findIndex((item) => item.id === node.id);
                        if (index < 0) return;
                        nodes[index] = updateTableCell(nodes[index], rowIndex, colIndex, input.value);
                        nodes = [...nodes];
                        exportJson();
                    });
                    rowEl.appendChild(input);
                });
                body.appendChild(rowEl);
            });
            tableEditor.appendChild(body);
        };

        const syncNodeEditor = () => {
            const node = nodes.find((item) => item.id === activeId);
            isSyncingEditor = true;
            const fieldValues = node ? {
                nodeParentId: node.parentId || 'root',
                nodeType: node.type,
                nodeTitle: node.title || '',
                nodeName: node.name,
                nodeText: node.text || '',
                nodeX: node.x,
                nodeY: node.y,
                nodeWidth: node.width,
                nodeHeight: node.height,
            } : {
                nodeParentId: '', nodeType: '', nodeTitle: '', nodeName: '', nodeText: '', nodeX: '', nodeY: '', nodeWidth: '', nodeHeight: ''
            };
            nodeEditorIds.forEach((id) => {
                const el = document.getElementById(id);
                const isActiveField = document.activeElement === el || activeEditorField === id;
                if (isActiveField) return;
                el.value = fieldValues[id] ?? '';
            });
            tableActions.style.display = node && node.type === 'table' ? 'flex' : 'none';
            renderTableEditor(node);
            isSyncingEditor = false;
        };
        const updateNode = () => { applyNodeEditorChanges({ push: true }); };
        const mutateActiveTable = (mutator) => {
            const index = nodes.findIndex((item) => item.id === activeId && item.type === 'table');
            if (index < 0) return;
            pushHistory();
            nodes[index] = constrainNode(mutator(nodes[index]), DEFAULT_CANVAS);
            nodes = [...nodes];
            render();
            exportJson();
        };

        const deleteNode = () => {
            if (!activeId) return;
            pushHistory();
            const deleteIds = new Set([activeId]);
            let changed = true;
            while (changed) {
                changed = false;
                nodes.forEach((item) => {
                    if (deleteIds.has(item.parentId) && !deleteIds.has(item.id)) { deleteIds.add(item.id); changed = true; }
                });
            }
            nodes = nodes.filter((item) => !deleteIds.has(item.id));
            activeId = null;
            render();
            exportJson();
        };
        const copyNode = () => { const node = nodes.find((item) => item.id === activeId); if (!node) return; pushHistory(); const copied = constrainNode(duplicateNode(node), DEFAULT_CANVAS); nodes = [...nodes, copied]; activeId = copied.id; render(); exportJson(); };
        const undo = () => { const state = history.pop(); if (!state) return; future.push(snapshot()); restore(state); };
        const redo = () => { const state = future.pop(); if (!state) return; history.push(snapshot()); restore(state); };
        const importJson = () => {
            try {
                pushHistory();
                const parsed = parseUnifiedJson(output.value);
                nodes = (parsed.nodes || []).map((node) => constrainNode(node, DEFAULT_CANVAS));
                const form = parsed.form || {};
                document.getElementById('pageType').value = form.pageType || 'list';
                document.getElementById('pageName').value = form.pageName || '未命名页面';
                document.getElementById('notes').value = form.notes || '';
                activeId = nodes[0]?.id || null;
                render();
                exportJson();
            } catch (error) {
                alert(`导入失败: ${error.message}`);
            }
        };
        const startDrag = (event, id, mode) => {
            applyNodeEditorChanges({ push: true });
            event.stopPropagation();
            event.preventDefault();
            closeInlineEditor();
            const node = nodes.find((item) => item.id === id);
            if (!node) return;
            activeId = id;
            dragState = { id, mode, startX: event.clientX, startY: event.clientY, originX: node.x, originY: node.y, originWidth: node.width, originHeight: node.height };
            render();
        };
        const openInlineEditor = (event, id, field = 'text') => {
            event.stopPropagation();
            event.preventDefault();
            const node = nodes.find((item) => item.id === id);
            if (!node) return;
            activeId = id;
            closeInlineEditor();
            const textarea = document.createElement('textarea');
            textarea.className = 'inline-editor';
            textarea.value = field === 'title' ? (node.title || '') : (node.text || '');
            textarea.style.left = `${node.x + 6}px`;
            textarea.style.top = `${field === 'title' ? node.y + 6 : node.y + 28}px`;
            textarea.style.width = `${Math.max(120, node.width - 12)}px`;
            textarea.style.height = `${field === 'title' ? 42 : Math.max(48, node.height - 34)}px`;
            textarea.addEventListener('mousedown', (mouseEvent) => mouseEvent.stopPropagation());
            textarea.addEventListener('keydown', (keyEvent) => {
                if ((keyEvent.metaKey || keyEvent.ctrlKey) && keyEvent.key === 'Enter') saveInlineEditor(id, textarea.value, field);
                if (keyEvent.key === 'Escape') closeInlineEditor();
            });
            textarea.addEventListener('blur', () => saveInlineEditor(id, textarea.value, field));
            canvas.appendChild(textarea);
            inlineEditor = textarea;
            textarea.focus();
            textarea.select();
        };
        const saveInlineEditor = (id, value, field = 'text') => {
            const index = nodes.findIndex((item) => item.id === id);
            if (index >= 0) {
                pushHistory();
                nodes[index] = field === 'title' ? updateNodeTitle(nodes[index], value) : updateNodeText(nodes[index], value);
                nodes[index] = constrainNode(nodes[index], DEFAULT_CANVAS);
                nodes = [...nodes];
            }
            closeInlineEditor();
            render();
            exportJson();
        };
        const closeInlineEditor = () => { if (inlineEditor && inlineEditor.parentNode) inlineEditor.parentNode.removeChild(inlineEditor); inlineEditor = null; };
        const openTableCellEditor = (event, nodeId, rowIndex, colIndex, value) => {
            event.stopPropagation();
            event.preventDefault();
            const node = nodes.find((item) => item.id === nodeId);
            if (!node) return;
            activeId = nodeId;
            activeTableCell = { nodeId, rowIndex, colIndex };
            closeInlineEditor();
            const textarea = document.createElement('textarea');
            textarea.className = 'inline-editor';
            textarea.value = value || '';
            textarea.style.left = `${node.x + 8}px`;
            textarea.style.top = `${node.y + 36}px`;
            textarea.style.width = `${Math.max(160, node.width - 16)}px`;
            textarea.style.height = `56px`;
            textarea.addEventListener('mousedown', (mouseEvent) => mouseEvent.stopPropagation());
            textarea.addEventListener('keydown', (keyEvent) => {
                if ((keyEvent.metaKey || keyEvent.ctrlKey) && keyEvent.key === 'Enter') saveTableCellEditor(nodeId, rowIndex, colIndex, textarea.value);
                if (keyEvent.key === 'Escape') closeInlineEditor();
            });
            textarea.addEventListener('blur', () => saveTableCellEditor(nodeId, rowIndex, colIndex, textarea.value));
            canvas.appendChild(textarea);
            inlineEditor = textarea;
            textarea.focus();
            textarea.select();
        };
        const saveTableCellEditor = (nodeId, rowIndex, colIndex, value) => {
            const index = nodes.findIndex((item) => item.id === nodeId);
            if (index >= 0) {
                pushHistory();
                if (rowIndex === -1) {
                    const current = nodes[index];
                    const table = normalizeTableConfig(current.tableConfig);
                    const columns = table.columns.map((col, idx) => idx === colIndex ? String(value || '').trim() || `列${idx + 1}` : col);
                    nodes[index] = {
                        ...current,
                        text: columns.join(' ｜ '),
                        tableConfig: { columns, rows: table.rows },
                    };
                } else {
                    nodes[index] = updateTableCell(nodes[index], rowIndex, colIndex, value);
                }
                nodes[index] = constrainNode(nodes[index], DEFAULT_CANVAS);
                nodes = [...nodes];
            }
            closeInlineEditor();
            render();
            exportJson();
        };
        window.addEventListener('mousemove', (event) => {
            if (!dragState) return;
            const index = nodes.findIndex((item) => item.id === dragState.id);
            if (index < 0) return;
            const deltaX = (event.clientX - dragState.startX) / zoom;
            const deltaY = (event.clientY - dragState.startY) / zoom;
            if (dragState.mode === 'move') {
                const moved = updateNodePosition({ ...nodes[index], x: dragState.originX, y: dragState.originY }, deltaX, deltaY, null, DEFAULT_CANVAS);
                guides = findAlignmentGuides(moved, nodes);
                nodes[index] = updateNodePosition({ ...nodes[index], x: dragState.originX, y: dragState.originY }, deltaX, deltaY, guides, DEFAULT_CANVAS);
            } else {
                nodes[index] = updateNodeSize({ ...nodes[index], width: dragState.originWidth, height: dragState.originHeight }, deltaX, deltaY, DEFAULT_CANVAS);
                guides = { x: null, y: null };
            }
            nodes = [...nodes];
            render();
        });
        window.addEventListener('mouseup', () => { if (dragState) exportJson(); guides = { x: null, y: null }; dragState = null; render(); });
        window.addEventListener('keydown', (event) => {
            if (inlineEditor) return;
            const target = event.target;
            const isTyping = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement;
            if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'd') { event.preventDefault(); copyNode(); return; }
            if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z' && !event.shiftKey) { event.preventDefault(); undo(); return; }
            if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z' && event.shiftKey) { event.preventDefault(); redo(); return; }
            if (event.key === 'Delete' && !isTyping) { deleteNode(); return; }
            if (!activeId || isTyping) return;
            const step = event.shiftKey ? GRID_SIZE * 4 : GRID_SIZE;
            if (event.key === 'ArrowUp') { event.preventDefault(); moveActiveNodeByKeyboard(0, -step); }
            if (event.key === 'ArrowDown') { event.preventDefault(); moveActiveNodeByKeyboard(0, step); }
            if (event.key === 'ArrowLeft') { event.preventDefault(); moveActiveNodeByKeyboard(-step, 0); }
            if (event.key === 'ArrowRight') { event.preventDefault(); moveActiveNodeByKeyboard(step, 0); }
        });
        nodeEditorIds.forEach((id) => {
            const el = document.getElementById(id);
            el.addEventListener('focus', () => { el.dataset.boundNodeId = activeId || ''; activeEditorField = id; });
            el.addEventListener('compositionstart', () => { isComposing = true; activeEditorField = id; });
            el.addEventListener('compositionend', () => { isComposing = false; activeEditorField = id; applyNodeEditorChanges({ push: true, targetId: el.dataset.boundNodeId || activeId }); });
            el.addEventListener('input', () => { activeEditorField = id; if (!isComposing) applyNodeEditorChanges({ targetId: el.dataset.boundNodeId || activeId }); });
            el.addEventListener('change', () => { activeEditorField = id; if (!isComposing) applyNodeEditorChanges({ push: true, targetId: el.dataset.boundNodeId || activeId }); });
            el.addEventListener('blur', () => { if (!isComposing) { applyNodeEditorChanges({ push: true, targetId: el.dataset.boundNodeId || activeId }); activeEditorField = null; } });
        });
        document.addEventListener('mousedown', (event) => {
            if (!nodeEditor.contains(event.target) && !isComposing) applyNodeEditorChanges({ push: true });
        }, true);
        document.getElementById('import-template').onclick = () => insertPreset(document.getElementById('template-select').value || 'list', document.getElementById('template-import-mode').value || 'replace');
        document.getElementById('undo').onclick = undo;
        document.getElementById('redo').onclick = redo;
        document.getElementById('duplicate-node').onclick = copyNode;
        document.getElementById('update-node').onclick = updateNode;
        document.getElementById('delete-node').onclick = deleteNode;
        document.getElementById('add-row').onclick = () => mutateActiveTable((node) => appendTableRow(node));
        document.getElementById('remove-row').onclick = () => mutateActiveTable((node) => removeTableRow(node));
        document.getElementById('add-col').onclick = () => mutateActiveTable((node) => appendTableColumn(node));
        document.getElementById('remove-col').onclick = () => mutateActiveTable((node) => removeTableColumn(node));
        document.getElementById('export-json').onclick = exportJson;
        document.getElementById('copy-json').onclick = async () => { if (!output.value) exportJson(); await navigator.clipboard.writeText(output.value); };
        document.getElementById('import-json').onclick = importJson;
        document.getElementById('zoom-in').onclick = () => { zoom = Math.min(2, Number((zoom + 0.1).toFixed(2))); applyZoom(); };
        document.getElementById('zoom-out').onclick = () => { zoom = Math.max(0.5, Number((zoom - 0.1).toFixed(2))); applyZoom(); };
        document.getElementById('zoom-reset').onclick = () => { zoom = fitCanvasZoom(); applyZoom(); };
        window.addEventListener('resize', () => { zoom = fitCanvasZoom(); applyZoom(); });
        formIds.forEach((id) => { document.getElementById(id).addEventListener('change', exportJson); });
        document.getElementById('pageType').addEventListener('change', (event) => {
            const value = event.target.value;
            const map = { list: 'list', dashboard: 'dashboard', form: 'form', detail: 'detail' };
            const templateSelect = document.getElementById('template-select');
            if (map[value]) templateSelect.value = map[value];
        });
        const componentButtons = [];
        COMPONENT_GROUPS.forEach((group, groupIndex) => {
            const details = document.createElement('details');
            details.className = 'component-group';
            const summary = document.createElement('summary');
            summary.textContent = group.title;
            details.appendChild(summary);
            const body = document.createElement('div');
            body.className = 'component-group-body';
            group.items.filter((type) => COMPONENT_LIBRARY.includes(type)).forEach((type) => {
                const meta = NODE_TYPE_META[type];
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'component-button';
                btn.dataset.type = type;
                btn.innerHTML = `${meta.label}<small>${Math.round(meta.defaultWidth)} × ${Math.round(meta.defaultHeight)}</small>`;
                btn.addEventListener('click', (event) => { event.preventDefault(); event.stopPropagation(); addNode(type); });
                componentButtons.push(btn);
                body.appendChild(btn);
            });
            details.appendChild(body);
            componentList.appendChild(details);
        });
        window.__FIGMA_DRAWER_DEBUG__ = { addNode, getNodes: () => nodes, componentButtons, clickType: (type) => { const btn = componentButtons.find((item) => item.dataset.type === type); if (!btn) throw new Error(`button not found: ${type}`); btn.click(); return nodes; } };
        zoom = fitCanvasZoom();
        applyZoom(); exportJson(); render(); syncHistoryButtons();
    </script>
</body>
</html>
